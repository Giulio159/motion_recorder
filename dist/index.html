<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Motion Cam</title>
    <script type="module" crossorigin src="/assets/index-BrsL6ipe.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CWgMtW81.css">
  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <main class="app">
      <section class="stage" id="stage">
        <canvas id="view"></canvas>
        <video id="cam" playsinline autoplay muted hidden></video>
        <div class="flash" id="flash"></div>

        <div class="status" id="status">
          <span class="dot"></span>
          <span id="statusText">Pronta</span>
          <span id="fpsMeter"></span>
        </div>

        <button class="hud-toggle" id="hudToggle" aria-label="Mostra o nascondi controlli">⤢</button>

        <div class="start-panel" id="startPanel">
          <h1>Motion Cam</h1>
          <p>Il video resta sul dispositivo.</p>
          <button id="startBtn" class="primary">Avvia fotocamera</button>
        </div>
      </section>

      <section class="controls" id="controls">
        <div class="settings-grid">
          <label>
            FPS
            <select id="fpsSelect" disabled></select>
          </label>
          <label>
            Formato
            <select id="aspectSelect">
              <option value="native">Nativo</option>
              <option value="4:3">4:3</option>
              <option value="16:9">16:9</option>
            </select>
          </label>
        </div>

        <label class="slider-row" id="zoomRow" hidden>
          <span>Zoom</span>
          <input id="zoom" type="range" min="1" max="1" step="0.1" value="1" />
          <output id="zoomValue">1×</output>
        </label>

        <label class="slider-row">
          <span>Sensibilità</span>
          <input id="sensitivity" type="range" min="1" max="30" value="8" />
          <output id="sensitivityValue">8</output>
        </label>

        <label class="slider-row">
          <span>Scia</span>
          <input id="trail" type="range" min="0" max="95" value="80" />
          <output id="trailValue">80</output>
        </label>

        <div class="bottom-row">
          <button id="flipBtn" class="side-btn" aria-label="Cambia fotocamera">⟲</button>
          <button id="photoBtn" class="side-btn" aria-label="Scatta foto">◎</button>
          <button id="recordBtn" class="record-btn" aria-label="Registra video"><span></span></button>
        </div>

        <div class="downloads">
          <a id="saveLink" download>Salva ultimo video</a>
          <a id="savePhotoLink" download>Salva ultima foto</a>
        </div>
      </section>
    </main>
  </body>
</html>
